name: Prune caches

# CI saves its compiler and Flatpak caches under the commit and its package caches under the week,
# and a restore only picks the newest under a prefix. The older ones stay until they go unused for
# 7 days. At the repository's 10 GB limit GitHub evicts the least recently used caches, which can
# be ones still in use.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prune-caches

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A family is the caches whose keys match once the commit or week is taken off the end, and
      # whose paths match (the version). Keeps the newest of each.
      - name: Delete the caches a restore no longer picks
        run: |
          old=$(gh cache list --ref refs/heads/main --limit 1000 --json id,key,version,createdAt,sizeInBytes --jq '
            group_by([(.key | sub("-([0-9a-f]{40}|[0-9]{4}-W[0-9]{2})$"; "")), .version])
            | map(sort_by(.createdAt) | .[:-1][]) | .[] | "\(.id) \(.sizeInBytes) \(.key)"')
          count=0 bytes=0
          while read -r id size key; do
            [ -n "$id" ] || continue
            echo "Deleting $key ($(numfmt --to=iec-i --suffix=B "$size"))"
            gh cache delete "$id"
            count=$((count + 1)) bytes=$((bytes + size))
          done <<< "$old"
          echo "Deleted $count caches, $(numfmt --to=iec-i --suffix=B "$bytes")." >> "$GITHUB_STEP_SUMMARY"
