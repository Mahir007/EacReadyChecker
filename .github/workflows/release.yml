name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$'; then
            echo "::error::$TAG isn't a version tag (v1.2.3, or v1.2.3-alpha.1, -beta.1 or -rc.1)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout makes the pushed tag a lightweight one, which loses its message.
      - name: Fetch the tags
        run: git fetch --force --tags origin
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write the release notes
        run: |
          python3 .github/scripts/release-notes.py "$TAG" "$GITHUB_REPOSITORY" release/*.sha256 > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            release/*.flatpak
            release/*.AppImage
      - name: Publish
        run: |
          prerelease=false
          case $VERSION in *-*) prerelease=true ;; esac
          # A re-run of a failed job finds the release already there.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --prerelease="$prerelease"
          else
            gh release create "$TAG" release/* --draft --title "$TAG" --notes-file notes.md \
              --prerelease="$prerelease" --verify-tag
          fi
          # The notes link to the files by name, and GitHub renames files with some characters in
          # their names. A pre-release's names have a "+". The release stays a draft until they're
          # checked.
          missing=$(comm -23 <(cd release && printf '%s\n' * | sort) <(gh release view "$TAG" --json assets -q '.assets[].name' | sort))
          if [ -n "$missing" ]; then
            echo "::error::GitHub renamed these files, so the notes' links don't work: $missing"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
      - name: Delete the release artifacts
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -q '.artifacts[] | select(.name | startswith("release-")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
