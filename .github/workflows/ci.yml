name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build, without the v
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APP_ID: io.github.Mahir007.EacReadyChecker
  # Qt warns and switches to UTF-8 under the containers' default C locale.
  LANG: C.UTF-8

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
      - name: ruff
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/astral-sh/ruff:0.17.6 check --no-cache .

  # The latest Debian release, with the apt packages from CONTRIBUTING.md.
  test-debian:
    name: test (Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:latest
    env:
      # dbus-daemon gives the colour scheme and motion tests a private session bus, and the checkout
      # needs ca-certificates, which git only recommends.
      PACKAGES: >-
        g++ git cmake ninja-build qt6-base-dev qt6-wayland qt6-svg-plugins breeze-icon-theme appstream desktop-file-utils
        qt6-base-private-dev qt6-wayland-private-dev qt6-svg-dev
        dbus-daemon ca-certificates ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # A new package cache each week, for each Debian release, and when the package list changes.
      # Each one starts from the last, so only updated packages are downloaded.
      - name: Cache keys
        id: packages
        run: |
          . /etc/os-release
          echo "prefix=packages-debian$VERSION_ID-" >> "$GITHUB_OUTPUT"
          echo "key=packages-debian$VERSION_ID-$(echo "$PACKAGES" | sha256sum | cut -c1-8)-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Restore the package cache
        id: restore-packages
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.packages.outputs.key }}
          restore-keys: ${{ steps.packages.outputs.prefix }}
      # The image deletes downloaded packages after each install.
      - name: Install packages
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          # PACKAGES is a list, so it's split on purpose.
          # shellcheck disable=SC2086
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PACKAGES
      # Drops the versions that are no longer installed, so the cache doesn't grow.
      - name: Prune the package cache
        if: github.ref == 'refs/heads/main' && steps.restore-packages.outputs.cache-hit != 'true'
        run: apt-get autoclean
      - name: Save the package cache
        if: github.ref == 'refs/heads/main' && steps.restore-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.packages.outputs.key }}
      - uses: actions/checkout@v7
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-debian-${{ github.sha }}
          restore-keys: ccache-debian-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEACHECK_DECORATIONS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-debian-${{ github.sha }}
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Homebrew's Qt and compiler, with the brew command from CONTRIBUTING.md. Breeze icons and the
  # tools for the appstream, desktop file and D-Bus tests come from Ubuntu.
  test-homebrew:
    name: test (Homebrew)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BREW_PACKAGES: glibc gcc cmake ninja qtbase qtsvg
      PACKAGES: breeze-icon-theme appstream desktop-file-utils dbus-daemon ccache
      CCACHE_MAXSIZE: 500M
      # Homebrew rewrites the compiler when it installs it, so the mtime ccache checks by default is
      # new on every run.
      CCACHE_COMPILERCHECK: content
      # The prefix without Homebrew itself, which the runner image brings.
      BREW_PREFIX_PATHS: |-
        /home/linuxbrew/.linuxbrew/*
        !/home/linuxbrew/.linuxbrew/Homebrew
    steps:
      - uses: actions/checkout@v7
      # The runner has Homebrew, but not on the PATH. As in the Debian job, the caches start again
      # each week and when the package lists change. apt downloads into the home folder, where the
      # cache action can read it.
      - name: Cache keys
        id: packages
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          week=$(date -u +%G-W%V)
          brew=brew-prefix-$(echo "$BREW_PACKAGES" | sha256sum | cut -c1-8)-
          {
            echo "apt=packages-homebrew-apt-$(echo "$PACKAGES" | sha256sum | cut -c1-8)-$week"
            echo "brew-prefix=$brew"
            echo "brew=$brew$week"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APT_ARCHIVES=$HOME/apt-archives"
            echo "CCACHE_DIR=$HOME/.ccache"
          } >> "$GITHUB_ENV"
      - name: Restore the apt package cache
        id: restore-apt
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.packages.outputs.apt }}
          restore-keys: packages-homebrew-apt-
      # The installed formulae, not their bottles: pouring 100 bottles takes longer than downloading
      # them.
      - name: Restore the Homebrew prefix
        id: restore-brew
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BREW_PREFIX_PATHS }}
          key: ${{ steps.packages.outputs.brew }}
          restore-keys: ${{ steps.packages.outputs.brew-prefix }}
      - name: Install packages
        env:
          RESTORED: ${{ steps.restore-brew.outputs.cache-matched-key != '' }}
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          sudo apt-get update
          # The package lists are split on purpose.
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$APT_ARCHIVES" -o APT::Keep-Downloaded-Packages=true $PACKAGES
          # A restored prefix can be up to a week old. This brings it up to date, so the job still
          # tests the newest Qt and GCC, and pours only the bottles that changed.
          if [ "$RESTORED" = true ]; then
            brew upgrade
          fi
          # shellcheck disable=SC2086
          brew install $BREW_PACKAGES
          gcc=$(brew list --versions gcc | cut -d' ' -f2 | cut -d. -f1)
          echo "CXX=$(brew --prefix)/bin/g++-$gcc" >> "$GITHUB_ENV"
      # Drop the versions that are no longer installed, so the caches don't grow.
      - name: Prune the package caches
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get autoclean -o Dir::Cache::Archives="$APT_ARCHIVES"
          brew autoremove
          brew cleanup --prune=all
      - name: Save the apt package cache
        if: github.ref == 'refs/heads/main' && steps.restore-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.packages.outputs.apt }}
      - name: Save the Homebrew prefix
        if: github.ref == 'refs/heads/main' && steps.restore-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BREW_PREFIX_PATHS }}
          key: ${{ steps.packages.outputs.brew }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-homebrew-${{ github.sha }}
          restore-keys: ccache-homebrew-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DEACHECK_DECORATIONS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-homebrew-${{ github.sha }}
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The oldest versions the build accepts: Qt 6.5.0 (QT_MIN_VERSION) from qt.io and CMake 3.22
  # (cmake_minimum_required) from PyPI, on AlmaLinux 9 with its GCC 11 and glibc 2.34, the oldest
  # the AppImage runs on.
  test-minimum:
    name: test (minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: almalinux:9
    env:
      QT_VERSION: 6.5.0
      CMAKE_VERSION: 3.22.6
      AQT_VERSION: 3.3.0
      QT_ARCHIVES: qtbase qtwayland qtsvg icu
      # The Qt private header check needs fontconfig-devel. Breeze and ccache are in EPEL.
      PACKAGES: >-
        gcc-c++ git ninja-build python3-pip libglvnd-devel libxkbcommon-devel wayland-devel fontconfig-devel
        breeze-icon-theme appstream desktop-file-utils dbus-daemon ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # As in the Debian job.
      - name: Cache keys
        id: packages
        run: |
          echo "key=packages-almalinux9-$(echo "$PACKAGES" | sha256sum | cut -c1-8)-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
      - name: Restore the package cache
        id: restore-packages
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/dnf/*/packages/*.rpm
          key: ${{ steps.packages.outputs.key }}
          restore-keys: packages-almalinux9-
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          # PACKAGES is a list, so it's split on purpose.
          # shellcheck disable=SC2086
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True $PACKAGES
      - name: Prune the package cache
        if: github.ref == 'refs/heads/main' && steps.restore-packages.outputs.cache-hit != 'true'
        run: |
          rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm\n' > /tmp/installed
          find /var/cache/dnf -name '*.rpm' | while read -r f; do
            grep -qxF "${f##*/}" /tmp/installed || rm -- "$f"
          done
      - name: Save the package cache
        if: github.ref == 'refs/heads/main' && steps.restore-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/dnf/*/packages/*.rpm
          key: ${{ steps.packages.outputs.key }}
      - uses: actions/checkout@v7
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-almalinux9-aqt-${{ env.AQT_VERSION }}-cmake-${{ env.CMAKE_VERSION }}
      - name: Install CMake and aqtinstall
        run: |
          python3 -m venv ~/tools
          ~/tools/bin/pip install "aqtinstall==$AQT_VERSION" "cmake==$CMAKE_VERSION"
          cmake --version
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-aqt-${{ env.AQT_VERSION }}-${{ env.QT_ARCHIVES }}
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          # QT_ARCHIVES is a list, so it's split on purpose.
          # shellcheck disable=SC2086
          aqt install-qt linux desktop "$QT_VERSION" gcc_64 --archives $QT_ARCHIVES --outputdir ~/qt
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-minimum-${{ github.sha }}
          restore-keys: ccache-minimum-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$HOME/qt/$QT_VERSION/gcc_64"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DEACHECK_DECORATIONS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-minimum-${{ github.sha }}
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Flatpak, built in the KDE SDK the manifest names. The bundle is the same file for the same
  # commit: the build and the OSTree commit use the commit's time, and so does the bundle's own
  # timestamp, which fix-bundle-time.py sets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # bubblewrap, which flatpak-builder runs the build in, needs it.
      options: --privileged
    steps:
      # The metainfo's releases come from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "VERSION=${VERSION:-0.0.0-dev+${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Restore the build cache
        uses: actions/cache/restore@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-kde-6.11-${{ github.sha }}
          restore-keys: flatpak-builder-kde-6.11-
      - name: Build
        run: |
          manifest=packaging/flatpak/$APP_ID.yml
          stamped=packaging/flatpak/stamped.yml
          # flatpak-builder leaves out .git, so the metainfo's releases are made here.
          python3 packaging/metainfo-releases.py "$VERSION" > packaging/flatpak/releases.xml
          sed "s/^\(      - -DBUILD_TESTING=OFF\)$/\1\n      - -DEACHECK_VERSION=$VERSION\n      - -DEACHECK_METAINFO_RELEASES=packaging\/flatpak\/releases.xml/" \
            "$manifest" > "$stamped"
          grep -q -- "-DEACHECK_VERSION=$VERSION$" "$stamped"
          grep -q -- "-DEACHECK_METAINFO_RELEASES=packaging/flatpak/releases.xml$" "$stamped"
          flatpak-builder --disable-rofiles-fuse --ccache --force-clean --default-branch=stable \
            --override-source-date-epoch="$SOURCE_DATE_EPOCH" "$RUNNER_TEMP/build" "$stamped"
      - name: Save the build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-kde-6.11-${{ github.sha }}
      - name: Bundle
        run: |
          bundle=eac-ready-checker-$VERSION-x86_64.flatpak
          mkdir dist
          flatpak build-export --timestamp="@$SOURCE_DATE_EPOCH" --exclude='/lib/debug/*' \
            "$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" stable
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "dist/$bundle" "$APP_ID" stable
          python3 .github/scripts/fix-bundle-time.py "dist/$bundle"
          (cd dist && sha256sum "$bundle" > "$bundle.sha256")
          {
            echo '| Archive | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            echo "| $bundle | $(numfmt --to=iec-i --suffix=B "$(stat -c %s "dist/$bundle")") | \`$(cut -d' ' -f1 "dist/$bundle.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Installs the bundle on a stock system, the way a user would, so the KDE runtime comes from
  # Flathub through the bundle's runtime repo. The build container already has it.
  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-flatpak
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends flatpak dbus-daemon
      - name: Check the bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c ./*.flatpak.sha256
          flatpak install --user -y --noninteractive ./*.flatpak
          # The runner has no session bus, and flatpak needs one for the app's D-Bus proxy.
          out=$(dbus-run-session -- flatpak run "$APP_ID" --version)
          echo "$out"
          if [ -n "$VERSION" ]; then
            [ "$out" = "eac-ready-checker $VERSION" ]
          else
            [ "$out" = "eac-ready-checker 0.0.0-dev+${GITHUB_SHA::7}" ]
          fi

  # The AppImage, with Qt from qt.io, built on AlmaLinux 9 so it runs on glibc 2.34 or later.
  # Like the bundle, the same commit gives the same file.
  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_VERSION: 6.11.3
      AQT_VERSION: 3.3.0
      QT_ARCHIVES: qtbase qtwayland qtsvg icu
    steps:
      # The metainfo's releases come from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=${VERSION:-0.0.0-dev+${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-aqt-${{ env.AQT_VERSION }}-${{ env.QT_ARCHIVES }}
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          # QT_ARCHIVES is a list, so it's split on purpose.
          # shellcheck disable=SC2086
          pipx run --spec "aqtinstall==$AQT_VERSION" aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --archives $QT_ARCHIVES --outputdir ~/qt
      - name: Cache the AppImage tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/eacheck-appimage
          key: appimage-tools-${{ hashFiles('packaging/appimage/build-appimage.sh') }}
      # As in the test job: a new package cache each week and when the package list changes, and a
      # compiler cache. build-in-container.sh mounts both into the container.
      - name: Cache keys
        id: packages
        run: |
          echo "key=packages-almalinux9-${{ hashFiles('packaging/appimage/build-in-container.sh') }}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_CACHE=$HOME/.cache/appimage-dnf" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/appimage-ccache" >> "$GITHUB_ENV"
      - name: Restore the package cache
        id: restore-packages
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/appimage-dnf
          key: ${{ steps.packages.outputs.key }}
          restore-keys: packages-almalinux9-
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/appimage-ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-
      - name: Build
        run: |
          appimage=eac-ready-checker-$VERSION-x86_64.AppImage
          packaging/appimage/build-in-container.sh ~/qt/"$QT_VERSION"/gcc_64 dist
          # The container writes as root.
          sudo chown -R "$(id -u):$(id -g)" ~/.cache dist
          {
            echo '| Archive | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            echo "| $appimage | $(numfmt --to=iec-i --suffix=B "$(stat -c %s "dist/$appimage")") | \`$(cut -d' ' -f1 "dist/$appimage.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the package cache
        if: github.ref == 'refs/heads/main' && steps.restore-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/appimage-dnf
          key: ${{ steps.packages.outputs.key }}
      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/appimage-ccache
          key: ccache-appimage-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Runs the AppImage on a stock system through FUSE, the way a user would. Then opens the window in
  # Weston with GNOME's settings, which loads the plugins the app needs there, the title bar plugin too.
  check-appimage:
    needs: build-appimage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-appimage
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fuse3 weston dbus-daemon
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c ./*.AppImage.sha256
          files=(*.AppImage)
          app=$PWD/${files[0]}
          echo "APP=$app" >> "$GITHUB_ENV"
          chmod +x "$app"
          out=$("$app" --version)
          echo "$out"
          [ "$out" = "eac-ready-checker ${VERSION:-0.0.0-dev+${GITHUB_SHA::7}}" ]
      # Only a release has it (build-appimage.sh). Its .zsync file has to describe this AppImage.
      - name: Check the update information
        env:
          VERSION: ${{ inputs.version }}
        run: |
          info=$("$APP" --appimage-updateinformation)
          echo "$info"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [ -z "$info" ] && [ ! -e "$APP.zsync" ]
            exit
          fi
          [ "$info" = 'gh-releases-zsync|Mahir007|EacReadyChecker|latest|eac-ready-checker-*-x86_64.AppImage.zsync' ]
          name=$(basename "$APP")
          header=$(sed '/^$/q' "$APP.zsync")
          echo "$header"
          grep -qx "Filename: $name" <<< "$header"
          grep -qx "URL: $name" <<< "$header"
          grep -qx "Length: $(stat -c %s "$APP")" <<< "$header"
          grep -qx "SHA-1: $(sha1sum "$APP" | cut -d' ' -f1)" <<< "$header"
      - name: Open the window
        run: |
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/run XDG_CURRENT_DESKTOP=GNOME WAYLAND_DISPLAY=wayland-check
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket="$WAYLAND_DISPLAY" > weston.log 2>&1 &
          for _ in $(seq 50); do
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
            sleep 0.1
          done
          # Still open after 5 seconds, so timeout stops it.
          status=0
          QT_DEBUG_PLUGINS=1 dbus-run-session -- timeout 5 "$APP" > app.log 2>&1 || status=$?
          kill %1
          if [ "$status" != 124 ]; then
            cat app.log
            exit 1
          fi
          grep 'loaded library' app.log
          grep -q 'libqadwaitadecorations.so" loaded library' app.log
          if grep -E "Cannot load library|Using Qt's title bar|Title bar shadow off" app.log; then
            exit 1
          fi
